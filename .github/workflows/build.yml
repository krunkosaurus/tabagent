name: Build Extension

# Test pull requests and main, and publish extension archives on version tags.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: # manual "Run workflow" button (build + artifact only)

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # lockfile-based cache (package-lock.json)

      - run: npm ci --ignore-scripts # reproducible install without lifecycle scripts
      - run: npm run typecheck
      - run: npm run build # node build.mjs -> dist/ (also generates manifest.json)
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

      # Every run: workflow artifact (90-day expiry, for testing latest commit).
      - uses: actions/upload-artifact@v4
        with:
          name: TabAgent
          path: dist
          if-no-files-found: error
          retention-days: 90

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TabAgent
          path: dist

      - name: Package zip
        working-directory: dist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: zip -r "../TabAgent-${RELEASE_TAG}.zip" .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: TabAgent-${{ github.ref_name }}.zip
          generate_release_notes: true
          name: ${{ github.ref_name }}
